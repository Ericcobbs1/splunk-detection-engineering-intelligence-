[script:dei_health]
match = /dei/v1/health
handler = dei.api.health_handler.HealthHandler
methods = GET
requireAuthentication = true
output_modes = json
passPayload = true

[script:dei_capabilities]
match = /dei/v1/capabilities
handler = dei.api.capabilities_handler.CapabilitiesHandler
methods = GET
requireAuthentication = true
output_modes = json
passPayload = true

[script:dei_telemetry_analyze]
match = /dei/v1/telemetry/analyze
handler = dei.api.telemetry_handler.TelemetryHandler
methods = POST
requireAuthentication = true
output_modes = json
passPayload = true

[script:dei_recommendations]
match = /dei/v1/recommendations
handler = dei.api.recommendations_handler.RecommendationsHandler
methods = POST
requireAuthentication = true
output_modes = json
passPayload = true
