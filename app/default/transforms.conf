[dei_configuration]
collection = dei_configuration
external_type = kvstore
fields_list = _key

[dei_projects]
collection = dei_projects
external_type = kvstore
fields_list = _key

[dei_assessments]
collection = dei_assessments
external_type = kvstore
fields_list = _key

[dei_telemetry_profiles]
collection = dei_telemetry_profiles
external_type = kvstore
fields_list = _key

[dei_recommendations]
collection = dei_recommendations
external_type = kvstore
fields_list = _key

[dei_detection_scores]
collection = dei_detection_scores
external_type = kvstore
fields_list = _key

[dei_pack_registry]
collection = dei_pack_registry
external_type = kvstore
fields_list = _key

[dei_user_preferences]
collection = dei_user_preferences
external_type = kvstore
fields_list = _key, filters, workspace, updated_at

[dei_lifecycle_records]
collection = dei_lifecycle_records
external_type = kvstore
fields_list = _key, _revision, detection_id, name, state, status, version, validation, review, deployment, monitoring, retirement, history, updated_at, updated_by

[dei_scan_summaries]
collection = dei_scan_summaries
external_type = kvstore
fields_list = _key, assessment_id, completed_at, discovery_window_days, active_window_days, known_sourcetype_count, active_sourcetype_count, recommendation_count

[dei_scan_history]
collection = dei_scan_history
external_type = kvstore
fields_list = _key, assessment_id, created_at, completed_at, discovery_window_days, active_window_days, known_sourcetype_count, active_sourcetype_count, recommendation_count
