name: Quality

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify React guide bundle
        run: |
          npm ci
          npm run build:guide
          git diff --exit-code -- app/appserver/static/dei_interactive_guide_v2.js

      - name: Install project and development tools
        run: python -m pip install --upgrade pip -e ".[dev]"

      - name: Lint
        run: ruff check app/bin tests

      - name: Type check
        run: mypy app/bin/dei

      - name: Unit tests
        run: pytest
