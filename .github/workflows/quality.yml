name: Quality

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify React guide bundle
        run: |
          npm ci
          npm run build:guide
          git diff --exit-code -- app/appserver/static/dei_interactive_guide_v3.js

      - name: Validate JavaScript and Simple XML
        run: |
          find app/appserver/static -name '*.js' -print0 | xargs -0 -n1 node --check
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          for path in Path("app").rglob("*.xml"):
              ElementTree.parse(path)
          PY

      - name: Validate installable package contract
        run: |
          bash tools/package_app.sh
          package="$(find dist -maxdepth 1 -name '*.spl' -print -quit)"
          tar -tzf "$package" | grep -Fx 'splunk_detection_engineering_intelligence/metadata/default.meta'
          if tar -tzf "$package" | grep -Eq '(__pycache__|\.pyc$)'; then exit 1; fi

      - name: Install project and development tools
        run: python -m pip install --upgrade pip -e ".[dev]"

      - name: Lint
        run: ruff check app/bin tests

      - name: Type check
        run: mypy app/bin/dei

      - name: Unit tests
        run: pytest
