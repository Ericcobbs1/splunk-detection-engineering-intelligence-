[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splunk-detection-engineering-intelligence"
version = "0.1.0"
description = "Telemetry-aware detection engineering intelligence for Splunk."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["app/bin"]
include = ["dei*"]

[tool.pytest.ini_options]
pythonpath = ["app/bin"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["app/bin", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
mypy_path = "app/bin"
